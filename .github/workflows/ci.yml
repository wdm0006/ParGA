name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust-test:
    name: Rust Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, beta]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ matrix.rust }}-${{ hashFiles('**/Cargo.toml') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build

      - name: Run tests
        run: cargo test

      - name: Build docs
        run: cargo doc --no-deps

  python-test:
    name: Python Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12']
        # Add standard Python 3.13 on Linux only to avoid multiplying the
        # full OS/version matrix.
        include:
          - os: ubuntu-latest
            python-version: '3.13'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pip install maturin pytest numpy cloudpickle

      - name: Build wheel
        run: maturin build --release

      - name: Install wheel
        run: pip install target/wheels/*.whl
        shell: bash

      - name: Run Python tests
        run: pytest python/tests/test_parga.py -v

  python-free-threaded:
    name: Python Free-Threaded Tests (3.13t)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up free-threaded Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13t'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pip install maturin pytest numpy cloudpickle

      - name: Build wheel
        run: maturin build --release

      - name: Install wheel
        run: pip install target/wheels/*.whl
        shell: bash

      - name: Assert free-threaded build
        # Fail loudly if this job is accidentally running a GIL build, so the
        # module-level skip in test_free_threaded.py cannot turn a
        # misconfigured job green without exercising any free-threaded code.
        run: |
          python -c "import sys, parga; assert parga.is_free_threaded(), 'parga was built for a GIL Python; free-threaded tests would be skipped'; print('free-threaded interpreter:', sys.version)"

      - name: Run free-threaded Python tests
        run: pytest python/tests/test_free_threaded.py -v

  packaging-viz-extra:
    name: Packaging (viz extra)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build wheel
        run: |
          pip install maturin
          maturin build --release

      - name: Check wheel metadata declares the viz extra
        run: |
          python - <<'PY'
          import email, glob, re, zipfile

          wheel = glob.glob("target/wheels/*.whl")[0]
          with zipfile.ZipFile(wheel) as zf:
              name = next(n for n in zf.namelist() if n.endswith(".dist-info/METADATA"))
              metadata = email.message_from_bytes(zf.read(name))

          assert "viz" in metadata.get_all("Provides-Extra", []), "wheel metadata is missing Provides-Extra: viz"

          # The build backend may emit the marker with single or double quotes.
          marker = re.compile(r"""extra\s*==\s*['"]viz['"]""")
          requires = [r for r in metadata.get_all("Requires-Dist", []) if r.startswith("matplotlib")]
          assert any(marker.search(r) for r in requires), f"matplotlib is not gated behind the viz extra: {requires}"

          # matplotlib must stay optional: it may not appear in the unconditional set.
          core = [r for r in metadata.get_all("Requires-Dist", []) if ";" not in r]
          assert not any(r.startswith("matplotlib") for r in core), f"matplotlib leaked into the core dependencies: {core}"
          print("\n".join(requires))
          PY

      - name: Install only the viz extra into a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/viz-env"
          "$RUNNER_TEMP/viz-env/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/viz-env/bin/python" -m pip install "$(ls target/wheels/*.whl)[viz]"

      - name: Import parga.viz from outside the checkout
        working-directory: ${{ runner.temp }}
        env:
          MPLBACKEND: Agg
        run: |
          "$RUNNER_TEMP/viz-env/bin/python" - <<'PY'
          import parga
          import parga.viz

          # Guard against importing the source tree instead of the installed wheel.
          assert "site-packages" in parga.__file__, parga.__file__
          assert parga.viz.HAS_MATPLOTLIB, "matplotlib was not installed by the viz extra"

          figure = parga.viz.plot_convergence([3.0, 2.0, 1.0], show=False)
          assert figure is not None
          print("parga.viz imported from", parga.viz.__file__)
          PY

      - name: Install the core package with no extras
        run: |
          python -m venv "$RUNNER_TEMP/core-env"
          "$RUNNER_TEMP/core-env/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/core-env/bin/python" -m pip install target/wheels/*.whl

      - name: Core install stays importable and keeps the guided error
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/core-env/bin/python" - <<'PY'
          import importlib.util

          import parga
          import parga.viz

          assert "site-packages" in parga.__file__, parga.__file__
          assert importlib.util.find_spec("matplotlib") is None, "matplotlib should not be installed without the viz extra"
          assert not parga.viz.HAS_MATPLOTLIB

          try:
              parga.viz.plot_convergence([1.0, 2.0], show=False)
          except ImportError as exc:
              assert "parga[viz]" in str(exc), str(exc)
              print("guided error:", exc)
          else:
              raise AssertionError("plot_convergence should raise ImportError without matplotlib")
          PY

  benchmark:
    name: Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run benchmarks
        run: cargo bench --no-run

  publish-check:
    name: Publish Check
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check publish
        run: cargo publish --dry-run

  msrv:
    name: Minimum Supported Rust Version
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.80
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.80"

      - name: Build with MSRV
        run: cargo build
